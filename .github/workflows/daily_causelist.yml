name: Generate Daily Karnataka HC Cause List

on:
  schedule:
    # 13:00 UTC = 18:30 IST (Monday to Friday)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  scrape_and_export:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper & LLM Parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py

      - name: Upload Output Artifacts (Success or Fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cause-list-results-${{ github.run_id }}
          path: |
            cause_list.xlsx
            causelist.pdf
            failure.png
            page_dump.html
          if-no-files-found: ignore
          retention-days: 14
